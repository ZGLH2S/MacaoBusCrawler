spring:
  devtools:
    livereload:
      enabled: true
    restart:
      additional-exclude: static/**,public/**,templates/**,mapper/**
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/bus_crawler?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8&allowPublicKeyRetrieval=true
    username: root
    password: 160091
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  mapper-locations:
    - classpath*:mapper/common/*Mapper.xml
  global-config:
    db-config:
      #主键类型  0:"数据库ID自增", 1:"用户输入ID",2:"全局唯一ID (数字类型唯一ID)", 3:"全局唯一ID UUID";
      id-type: ASSIGN_UUID
      #逻辑删除配置
      logic-delete-value: false
      logic-not-delete-value: true

feign:
  client:
    config:
      aiClient:
        connectTimeout: 10000
        readTimeout: 120000

macauWeb:
